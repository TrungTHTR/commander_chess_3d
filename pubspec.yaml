name: commander_chess_3d
description: "3D Flutter Commander Chess (Cờ Tư Lệnh) starter architecture and playable placeholder 3D scene."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  vector_math: ^2.4.3
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/commander_table.webp
    - assets/models/asset_manifest.json
    - assets/models/pieces/
  shaders:
    - assets/shaders/terrain_highlight.frag
